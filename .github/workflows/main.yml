name: 随机抽取号码

on:
  workflow_dispatch:

jobs:
  random-pick:
    runs-on: ubuntu-latest
    steps:
      - name: 随机抽号
        id: pick
        run: |
          # 号码列表
          NUMBERS=(
            3791456280
            5827901346
            4618372950
            7382049165
            2956183704
            8163495027
            9475038216
            3049781652
            6592817403
            1238470956
            8706321549
            5461803972
            7129586034
            2854763190
            4392618705
            9685347210
            1573094286
            6247189530
            8390642751
            4905823671
            2057946183
            3761508429
            8142673095
            6318954207
            5720483196
            7896543201
            3456217890
            9024371586
            1567892340
            8675309241
            2938456107
            4187695032
            7654108239
            5392764810
            6871239540
            3201986754
            9514823076
            2049637518
            4781053962
            8362751904
            6157409382
            1928346570
            5703892146
            4236195708
            9562078134
            7489153062
            3810467295
            2693518470
            5347921806
            8974563210
          )

          TOTAL=${#NUMBERS[@]}
          PICK_COUNT=10

          # 使用 shuf 打乱后取前 PICK_COUNT 个
          SELECTED=$(printf "%s\n" "${NUMBERS[@]}" | shuf -n $PICK_COUNT)
          
          # 转为逗号分隔的字符串
          SELECTED_STR=$(echo "$SELECTED" | tr '\n' ',' | sed 's/,$//')

          echo "selected<<EOF" >> $GITHUB_OUTPUT
          echo "$SELECTED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "selected_str=$SELECTED_STR" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "pick_count=$PICK_COUNT" >> $GITHUB_OUTPUT
          
          echo "从 ${TOTAL} 个号码中抽取了 ${PICK_COUNT} 个"

      - name: 显示抽取结果
        run: |
          echo "从 ${{ steps.pick.outputs.total }} 个号码中抽取了 ${{ steps.pick.outputs.pick_count }} 个"
          echo ""
          echo "随机号码：${{ steps.pick.outputs.selected_str }}"
          echo ""
          echo "详细列表："
          echo "${{ steps.pick.outputs.selected }}"
