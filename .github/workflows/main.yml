name: 随机抽取号码

on:
  workflow_dispatch:

jobs:
  random-pick:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 随机抽号
        id: pick
        run: |
          # 号码列表（每行一个）
          NUMBERS=$(cat << 'EOF'
          abcdefg
          121efsf
          ？？
          Lyang1273
          yang L
          sfsdfsdf
          啊哈哈哈
          热狗
          EOF
          )

          # 用 mapfile 读取每一行，保留空格
          mapfile -t ARRAY <<< "$NUMBERS"
          TOTAL=${#ARRAY[@]}
          PICK_COUNT=2

          # 打乱后取前 PICK_COUNT 个
          SELECTED=$(printf "%s\n" "${ARRAY[@]}" | shuf -n $PICK_COUNT)

          # 转为顿号分隔（保留空格）
          SELECTED_STR=$(echo "$SELECTED" | while IFS= read -r line; do
            echo -n "$line、"
          done | sed 's/、$//')

          echo "selected<<EOF" >> $GITHUB_OUTPUT
          echo "$SELECTED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "selected_str=$SELECTED_STR" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "pick_count=$PICK_COUNT" >> $GITHUB_OUTPUT
          
          echo "从 ${TOTAL} 个号码中抽取了 ${PICK_COUNT} 个"

      - name: 更新 README.md
        run: |
          # 获取日期和 Actions 编号
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          RUN_ID="${{ github.run_id }}"
          SELECTED="${{ steps.pick.outputs.selected_str }}"
          
          # 直接覆盖写入 README.md
          cat > README.md << EOF
          # 随机抽取记录

          ${DATE} ${RUN_ID}
          ${SELECTED}
          EOF
          
          echo "README.md 已更新"

      - name: 提交并推送改动
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          
          if git diff --staged --quiet; then
            echo "README.md 没有变化，跳过提交"
          else
            git commit -m "更新随机抽取记录 (run #${{ github.run_id }})"
            git push
            echo "已推送到仓库"
          fi

      - name: 显示抽取结果
        run: |
          echo "从 ${{ steps.pick.outputs.total }} 个号码中抽取了 ${{ steps.pick.outputs.pick_count }} 个"
          echo ""
          echo "随机号码：${{ steps.pick.outputs.selected_str }}"
          echo ""
          echo "详细列表："
          echo "${{ steps.pick.outputs.selected }}"
          echo ""
          echo "结果已覆盖写入 README.md"
